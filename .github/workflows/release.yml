name: Release

# Publish a new module version only after the main-branch build and tests pass.
on:
  workflow_run:
    workflows: [Build AlwaysStrongFork]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check release version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' module/module.prop)
          [[ "$version" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          existing=$(gh release view "$version" --json isDraft --jq .isDraft 2>/dev/null || :)
          if [ "$existing" = false ]; then
            test -s "releases/$version.md"
            gh release edit "$version" --title "AlwaysStrongFork $version" \
              --notes-file "releases/$version.md"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $version notes synchronized. Existing assets are preserved."
            gh release view "$version" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
          else
            test -s "releases/$version.md"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "existing=$existing" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ZIPs from the successful build
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: AlwaysStrongFork-module-zip
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and publish release assets
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          EXISTING_DRAFT: ${{ steps.version.outputs.existing }}
        run: |
          set -euo pipefail
          python3 scripts/verify-module-zip.py out/AlwaysStrong-*.zip
          (cd out && sha256sum -c SHA256SUMS.txt)
          for suffix in '' '-inject' '-nopif'; do
            test -s "out/AlwaysStrong-${VERSION}${suffix}.zip"
          done
          test "$(find out -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          if [ "$EXISTING_DRAFT" != true ]; then
            gh release create "$VERSION" --draft --target "$SOURCE_SHA" \
              --title "AlwaysStrongFork $VERSION" --notes-file "releases/$VERSION.md"
          fi
          gh release upload "$VERSION" out/AlwaysStrong-*.zip out/SHA256SUMS.txt --clobber
          gh release edit "$VERSION" --draft=false --latest
          gh release view "$VERSION" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
