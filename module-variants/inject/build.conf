# Build config — PlayIntegrityFix inject-s line (the -inject build).
#
# Sourced by build.sh. Files under ship/ are overlaid onto module/ and end up in
# the zip; everything at this level is build-time only. scripts/update-upstream.sh
# rewrites PIF_TAG / PIF_ASSET, so each line's pin sits with the line.

# Asset name suffix, so both lines fit in one release.
ZIP_SUFFIX="-inject"

# Upstream Play Integrity engine. v4.9-inject-s is the latest inject-s release
# (2026-10-15). Same zip layout as v4.7 (autopif.sh / pif.prop / security_patch.sh).
PIF_REPO="KOWX712/PlayIntegrityFix"
PIF_TAG="v4.9-inject-s"
PIF_ASSET="PlayIntegrityFix_v4.9-inject-s.zip"

# The same repo also publishes non-inject builds; only inject-s carries the
# zygisk this line needs, so the update check filters on it.
PIF_ASSET_FILTER="inject-s"

# Files lifted out of the upstream zip into the module.
PIF_FILES="autopif.sh pif.prop security_patch.sh"

# Missing any of these means upstream changed its layout: the build fails rather
# than ship a module whose fingerprint refresh quietly does nothing.
PIF_REQUIRED="autopif.sh"

# Upstream scripts whose hardcoded /data/adb/modules/playintegrityfix paths are
# rewritten to our module id.
PIF_PATCH_PATHS="autopif.sh security_patch.sh"

# inject-s has no autopif4.sh to patch.
PATCH_AUTOPIF4_WGET=0

# This zygisk CRC32s module.prop against a checksum baked into the upstream
# release and drops its whole payload on mismatch — we ship our own module.prop,
# so it reports the module as tampered and stops spoofing. Its only early-out is
# access(<moddir>/update)==0. Shipping an `update` marker is not an option:
# KernelSU reads one as a pending module update and won't let you toggle the
# module. build.sh instead repoints that access() path at zygisk/, which always
# exists next to the .so, so the check passes without a marker file.
#
# A tamper check on a GPL project is a curious thing to ship: the source is right
# there, so it stops nobody who reads it and only trips up honest repackagers who
# have every right to modify it. All it took to defer to was a 6-byte edit. If
# the intent was to keep forks in line, a LICENSE does that; a CRC32 just adds a
# speed bump for the people already playing by the rules.
PIF_ANTITAMPER=1
